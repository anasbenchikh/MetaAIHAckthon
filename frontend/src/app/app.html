<mat-sidenav-container class="shell">
  <mat-sidenav
    #drawer
    class="sidebar"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
  >
    <div class="brand">
      <mat-icon>plumbing</mat-icon>
      <div>
        <div class="brand-name">Plombier Express Lyon</div>
        <div class="brand-sub">Dashboard Sarah</div>
      </div>
    </div>
    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="isHandset() && drawer.close()"
      >
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>{{ lang.t('nav.dashboard') }}</span>
      </a>
      <a
        mat-list-item
        routerLink="/leads"
        routerLinkActive="active"
        (click)="isHandset() && drawer.close()"
      >
        <mat-icon matListItemIcon>group</mat-icon>
        <span matListItemTitle>{{ lang.t('nav.leads') }}</span>
      </a>
      <a
        mat-list-item
        routerLink="/appointments"
        routerLinkActive="active"
        (click)="isHandset() && drawer.close()"
      >
        <mat-icon matListItemIcon>calendar_month</mat-icon>
        <span matListItemTitle>{{ lang.t('nav.appointments') }}</span>
      </a>
      <a
        mat-list-item
        routerLink="/quotes"
        routerLinkActive="active"
        (click)="isHandset() && drawer.close()"
      >
        <mat-icon matListItemIcon>request_quote</mat-icon>
        <span matListItemTitle>{{ lang.t('nav.quotes') }}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="topbar">
      @if (isHandset()) {
        <button mat-icon-button (click)="drawer.toggle()" [attr.aria-label]="lang.t('nav.menu')">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span>Plombier Express Lyon - Dashboard Sarah</span>
      <span class="spacer"></span>
      <button mat-button (click)="lang.set('fr')" [disabled]="lang.current() === 'fr'">FR</button>
      <button mat-button (click)="lang.set('en')" [disabled]="lang.current() === 'en'">EN</button>
    </mat-toolbar>
    <main>
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
